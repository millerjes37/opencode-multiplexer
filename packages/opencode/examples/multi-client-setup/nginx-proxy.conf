# OpenCode Server - nginx Reverse Proxy Configuration
# This configuration provides secure remote access with TLS and optional authentication

# Upstream backend (OpenCode server)
upstream opencode_backend {
    server 127.0.0.1:4096;
    
    # For load balancing multiple servers:
    # server 127.0.0.1:4096;
    # server 127.0.0.1:4097;
    # server 127.0.0.1:4098;
    
    # Health check settings
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name opencode.example.com;
    
    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other requests to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name opencode.example.com;
    
    # TLS/SSL Configuration
    ssl_certificate /etc/letsencrypt/live/opencode.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opencode.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/opencode.example.com/chain.pem;
    
    # Modern SSL configuration (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # SSL session cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Logging
    access_log /var/log/nginx/opencode-access.log;
    error_log /var/log/nginx/opencode-error.log;
    
    # Basic Authentication (optional but recommended)
    # Generate password file with: htpasswd -c /etc/nginx/.htpasswd username
    auth_basic "OpenCode Server";
    auth_basic_user_file /etc/nginx/.htpasswd;
    
    # Main proxy configuration
    location / {
        proxy_pass http://opencode_backend;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;  # Long timeout for SSE connections
        
        # Buffering (disable for SSE)
        proxy_buffering off;
        proxy_cache off;
        
        # HTTP version
        proxy_http_version 1.1;
        
        # WebSocket/SSE support
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }
    
    # Health check endpoint (no auth required)
    location /health {
        auth_basic off;
        proxy_pass http://opencode_backend/health;
        access_log off;
    }
    
    # Rate limiting for API endpoints (optional)
    # limit_req_zone $binary_remote_addr zone=opencode_api:10m rate=10r/s;
    # location /session {
    #     limit_req zone=opencode_api burst=20 nodelay;
    #     proxy_pass http://opencode_backend;
    # }
}

# Installation Instructions:
#
# 1. Install nginx and certbot:
#    sudo apt-get update
#    sudo apt-get install nginx certbot python3-certbot-nginx
#
# 2. Update server_name with your domain:
#    - Replace opencode.example.com with your actual domain
#
# 3. Get TLS certificate:
#    sudo certbot --nginx -d opencode.example.com
#
# 4. Create password file for basic auth:
#    sudo apt-get install apache2-utils
#    sudo htpasswd -c /etc/nginx/.htpasswd your-username
#
# 5. Copy this file:
#    sudo cp nginx-proxy.conf /etc/nginx/sites-available/opencode
#
# 6. Enable the site:
#    sudo ln -s /etc/nginx/sites-available/opencode /etc/nginx/sites-enabled/
#
# 7. Test configuration:
#    sudo nginx -t
#
# 8. Reload nginx:
#    sudo systemctl reload nginx
#
# 9. Connect client:
#    opencode --server https://opencode.example.com
#
# 10. Auto-renew certificates:
#     sudo certbot renew --dry-run
#
# Troubleshooting:
# - Check nginx logs: sudo tail -f /var/log/nginx/opencode-error.log
# - Test SSL: https://www.ssllabs.com/ssltest/
# - Verify certificate: sudo certbot certificates
